name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Annotated tags only: release body = `git tag -a -m "..."`; empty / title-only notes fail the job.
      - name: Create draft release from annotated tag message
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed -e 's/[[:space:]]*$//' )
          NOTES_TRIM=$(printf '%s' "$NOTES" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          TITLE_ONLY="SlimMusic $TAG"
          if [ -z "$NOTES_TRIM" ] || [ "$NOTES_TRIM" = "$TAG" ] || [ "$NOTES_TRIM" = "$TITLE_ONLY" ]; then
            echo "::error::Release notes required: create an annotated tag with a real changelog message (git tag -a $TAG -m '...'). Lightweight tags or title-only messages are rejected."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            BODY=$(gh release view "$TAG" --json body -q .body)
            BODY_TRIM=$(printf '%s' "$BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$BODY_TRIM" ] || [ "$BODY_TRIM" = "$TAG" ] || [ "$BODY_TRIM" = "$TITLE_ONLY" ]; then
              gh release edit "$TAG" --notes "$NOTES_TRIM"
            fi
          else
            gh release create "$TAG" --draft --title "$TITLE_ONLY" --notes "$NOTES_TRIM"
          fi

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SlimMusic ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: Signing config
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > src-tauri/gen/android/keystore.properties
      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android build --apk --target aarch64
      - name: Upload APK
        run: |
          VER=$(node -p "require('./package.json').version")
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*release.apk | grep -v unsigned | head -1)
          cp "$APK" "SlimMusic_${VER}_android_arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "SlimMusic_${VER}_android_arm64.apk" | grep SHA-256
          gh release upload "$GITHUB_REF_NAME" "SlimMusic_${VER}_android_arm64.apk" --clobber

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish release (require non-empty notes)
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          BODY=$(gh release view "$TAG" --json body -q .body)
          BODY_TRIM=$(printf '%s' "$BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          TITLE_ONLY="SlimMusic $TAG"
          if [ -z "$BODY_TRIM" ] || [ "$BODY_TRIM" = "$TAG" ] || [ "$BODY_TRIM" = "$TITLE_ONLY" ]; then
            NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed -e 's/[[:space:]]*$//' )
            NOTES_TRIM=$(printf '%s' "$NOTES" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$NOTES_TRIM" ] || [ "$NOTES_TRIM" = "$TAG" ] || [ "$NOTES_TRIM" = "$TITLE_ONLY" ]; then
              echo "::error::Cannot publish $TAG: release body and annotated tag message are both empty/title-only."
              exit 1
            fi
            gh release edit "$TAG" --notes "$NOTES_TRIM"
          fi
          gh release edit "$TAG" --draft=false --latest
