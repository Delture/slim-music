<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlimMusic Lyric</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent !important;
        height: 100%;
        width: 100%;
        user-select: none;
        -webkit-user-select: none;
      }
      #line {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 8px;
        box-sizing: border-box;
        font: 600 12px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        letter-spacing: 0.01em;
        color: rgba(0, 0, 0, 0.85);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 0 1px rgba(255, 255, 255, 0.35);
      }
      @media (prefers-color-scheme: dark) {
        #line {
          color: rgba(255, 255, 255, 0.92);
          text-shadow: 0 0 1px rgba(0, 0, 0, 0.45);
        }
      }
    </style>
  </head>
  <body>
    <div id="line"></div>
    <script type="module" src="/src/lyric-bar.ts"></script>
  </body>
</html>
